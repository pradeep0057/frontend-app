kind: pipeline
type: docker
name: deploy-test

steps:
  - name: deploy
    image: 656853518128.dkr.ecr.us-east-1.amazonaws.com/deploy-tools:latest
    environment:
      AWS_ACCESS_KEY_ID:
        from_secret: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY:
        from_secret: AWS_SECRET_ACCESS_KEY
      AWS_REGION:
        from_secret: AWS_REGION
      EKS_CLUSTER_NAME:
        from_secret: EKS_CLUSTER_NAME
    commands:
      - aws sts get-caller-identity
      - aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER_NAME
      - kubectl get nodes
      - kubectl get ns