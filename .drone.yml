kind: pipeline
type: docker
name: ecr-test

steps:
  - name: build-image
    image: docker:24-cli
    environment:
      AWS_ACCOUNT_ID:
        from_secret: AWS_ACCOUNT_ID
      AWS_REGION:
        from_secret: AWS_REGION
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    commands:
      - docker build -t drone-test:latest .
      - docker tag drone-test:latest $${AWS_ACCOUNT_ID}.dkr.ecr.$${AWS_REGION}.amazonaws.com/drone-test:test
      - docker images

  - name: push-image
    image: plugins/ecr
    settings:
      repo: drone-test
      region:
        from_secret: AWS_REGION
      access_key:
        from_secret: AWS_ACCESS_KEY_ID
      secret_key:
        from_secret: AWS_SECRET_ACCESS_KEY
    tags:
      - test

volumes:
  - name: dockersock
    host:
      path: /var/run/docker.sock