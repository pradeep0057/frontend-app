kind: pipeline
type: docker
name: build-push-deploy

steps:

- name: build-image
  image: docker:24-cli

  environment:
    AWS_ACCOUNT_ID:
      from_secret: AWS_ACCOUNT_ID

    AWS_REGION:
      from_secret: AWS_REGION

  volumes:
  - name: dockersock
    path: /var/run/docker.sock

  commands:
    - docker build -t drone-test:latest .
    - docker tag drone-test:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/drone-test:latest

- name: push-ecr
  image: plugins/ecr

  settings:
    repo: drone-test

    registry:
      from_secret: AWS_ECR_REGISTRY

    region:
      from_secret: AWS_REGION

    access_key:
      from_secret: AWS_ACCESS_KEY_ID

    secret_key:
      from_secret: AWS_SECRET_ACCESS_KEY

    tags:
      - latest

- name: deploy-eks
  image: bitnami/kubectl

  environment:
    AWS_ACCESS_KEY_ID:
      from_secret: AWS_ACCESS_KEY_ID

    AWS_SECRET_ACCESS_KEY:
      from_secret: AWS_SECRET_ACCESS_KEY

    AWS_REGION:
      from_secret: AWS_REGION

    EKS_CLUSTER_NAME:
      from_secret: EKS_CLUSTER_NAME

  commands:
    - echo "Configure EKS access here"
    - kubectl apply -f K8s/
    - kubectl rollout restart deployment/drone-test -n dev

volumes:
- name: dockersock
  host:
    path: /var/run/docker.sock