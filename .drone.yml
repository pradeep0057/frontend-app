kind: pipeline
type: docker
name: build-push

steps:
- name: build-image
  image: docker:24-cli

  volumes:
  - name: dockersock
    path: /var/run/docker.sock

  commands:
    - docker build -t frontend-app:latest .

- name: push-image
  image: docker:24-cli

  environment:
    AWS_ACCOUNT_ID:
      from_secret: AWS_ACCOUNT_ID

    AWS_REGION:
      from_secret: AWS_REGION

    AWS_ACCESS_KEY_ID:
      from_secret: AWS_ACCESS_KEY_ID

    AWS_SECRET_ACCESS_KEY:
      from_secret: AWS_SECRET_ACCESS_KEY

  volumes:
  - name: dockersock
    path: /var/run/docker.sock

  commands:
    - apk add --no-cache curl unzip

    - curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip

    - unzip awscliv2.zip

    - ./aws/install

    - /usr/local/bin/aws --version

    - /usr/local/bin/aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

    - docker tag frontend-app:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/frontend-app:latest

    - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/frontend-app:latest

volumes:
- name: dockersock
  host:
    path: /var/run/docker.sock