kind: pipeline
type: docker
name: build-deploy

steps:
  # Step 1: Build & Push to AWS ECR using host's Docker socket
  - name: build-and-push
    image: plugins/ecr
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    settings:
      access_key:
        from_secret: AWS_ACCESS_KEY_ID
      secret_key:
        from_secret: AWS_SECRET_ACCESS_KEY
      region:
        from_secret: AWS_REGION
      repo: drone-test
      tags: 
        - 99
        - ${DRONE_COMMIT_SHA:0:7}

  # Step 2: Deploy to EKS using a verified image
  - name: deploy-to-eks
    image: alpine/k8s:1.30.2
    environment:
      AWS_ACCESS_KEY_ID:
        from_secret: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY:
        from_secret: AWS_SECRET_ACCESS_KEY
      AWS_REGION:
        from_secret: AWS_REGION
      EKS_CLUSTER_NAME:
        from_secret: EKS_CLUSTER_NAME
    commands:
      # Authenticate kubectl with your EKS cluster
      - aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER_NAME
      # Deploy resources
      - kubectl apply -f K8s/
      - kubectl rollout restart deployment/frontend-app -n stage
      - kubectl rollout status deployment/frontend-app -n stage

# Global volumes configuration
volumes:
  - name: dockersock
    host:
      path: /var/run/docker.sock