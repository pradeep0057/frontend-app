kind: pipeline
type: docker
name: deploy-tools-test

steps:
  - name: build-deploy-image
    image: docker:24-cli
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    commands:
      - docker build -f Dockerfile.deploy -t deploy-tools:latest .
      - docker images

volumes:
  - name: dockersock
    host:
      path: /var/run/docker.sock