kind: pipeline
type: docker
name: build-push-deploy

steps:

- name: build-image
  image: docker:24-cli

  volumes:
  - name: dockersock
    path: /var/run/docker.sock

  commands:
    - docker build -t drone-test:latest .
    - docker tag drone-test:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/drone-test:latest

- name: push-image
  image: docker:24-cli

  environment:
    AWS_ACCESS_KEY_ID:
      from_secret: AWS_ACCESS_KEY_ID

    AWS_SECRET_ACCESS_KEY:
      from_secret: AWS_SECRET_ACCESS_KEY

    AWS_REGION:
      from_secret: AWS_REGION

    AWS_ACCOUNT_ID:
      from_secret: AWS_ACCOUNT_ID

  volumes:
  - name: dockersock
    path: /var/run/docker.sock

  commands:
    - apk add --no-cache curl
    - TOKEN=$(curl -s -X POST "https://api.ecr.aws/token") || true
    - echo "Use ECR login method here if needed"

- name: deploy
  image: bitnami/kubectl

  environment:
    AWS_ACCESS_KEY_ID:
      from_secret: AWS_ACCESS_KEY_ID

    AWS_SECRET_ACCESS_KEY:
      from_secret: AWS_SECRET_ACCESS_KEY

    AWS_REGION:
      from_secret: AWS_REGION

    EKS_CLUSTER_NAME:
      from_secret: EKS_CLUSTER_NAME

  commands:
    - echo "Configure kubectl for EKS"
    - kubectl apply -f K8s/
    - kubectl rollout restart deployment/drone-test -n dev

volumes:
- name: dockersock
  host:
    path: /var/run/docker.sock