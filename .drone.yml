kind: pipeline
type: docker
name: build-deploy

steps:
  # Step 1: Build & Push to AWS ECR using the official plugin
  - name: build-and-push
    image: plugins/ecr
    settings:
      access_key:
        from_secret: AWS_ACCESS_KEY_ID
      secret_key:
        from_secret: AWS_SECRET_ACCESS_KEY
      region:
        from_secret: AWS_REGION
      repo: drone-test
      tags: 
        - latest
        - ${DRONE_COMMIT_SHA:0:7} # Good practice: tag with git commit hash too

  # Step 2: Deploy to EKS using pre-installed AWS & Kubectl tools
  - name: deploy-to-eks
    image: line/kubectl-aws-cli:latest
    environment:
      AWS_ACCESS_KEY_ID:
        from_secret: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY:
        from_secret: AWS_SECRET_ACCESS_KEY
      AWS_REGION:
        from_secret: AWS_REGION
      EKS_CLUSTER_NAME:
        from_secret: EKS_CLUSTER_NAME
    commands:
      # Authenticate kubectl with your EKS cluster
      - aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER_NAME
      # Apply manifests and trigger rolling update
      - kubectl apply -f K8s/
      - kubectl rollout restart deployment/frontend-app -n stage
      - kubectl rollout status deployment/frontend-app -n stage # Safer than 'get pods' (waits for success)