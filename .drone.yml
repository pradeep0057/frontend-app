kind: pipeline
type: docker
name: build-push-deploy

steps:
  - name: build-image
    image: docker:24-cli
    environment:
      AWS_ACCOUNT_ID:
        from_secret: AWS_ACCOUNT_ID
      AWS_REGION:
        from_secret: AWS_REGION
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    commands:
      - docker build -t drone-test:latest .
      - docker tag drone-test:1 $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/drone-test:latest

  - name: deploy
    image: amazon/aws-cli:latest
    environment:
      AWS_ACCESS_KEY_ID:
        from_secret: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY:
        from_secret: AWS_SECRET_ACCESS_KEY
      AWS_REGION:
        from_secret: AWS_REGION
      EKS_CLUSTER_NAME:
        from_secret: EKS_CLUSTER_NAME
    commands:
      - curl -LO https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl
      - chmod +x kubectl
      - mv kubectl /usr/local/bin/kubectl
      - aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER_NAME
      - kubectl apply -f K8s/
      - kubectl rollout restart deployment/frontend-app -n dev
      - kubectl get pods -n dev

volumes:
  - name: dockersock
    host:
      path: /var/run/docker.sock