kind: pipeline
type: docker
name: deploy

steps:

- name: build-image
  image: docker:24-cli

  volumes:
  - name: dockersock
    path: /var/run/docker.sock

  commands:
    - docker build -t frontend-app:latest .

- name: push-ecr
  image: amazon/aws-cli

  environment:
    AWS_ACCESS_KEY_ID:
      from_secret: AWS_ACCESS_KEY_ID

    AWS_SECRET_ACCESS_KEY:
      from_secret: AWS_SECRET_ACCESS_KEY

    AWS_REGION:
      from_secret: AWS_REGION

    AWS_ACCOUNT_ID:
      from_secret: AWS_ACCOUNT_ID

  volumes:
  - name: dockersock
    path: /var/run/docker.sock

  commands:
    - aws --version

    - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

    - docker tag frontend-app:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/frontend-app:latest

    - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/frontend-app:latest

volumes:
- name: dockersock
  host:
    path: /var/run/docker.sock