kind: pipeline
type: docker
name: build-push

steps:
- name: build-and-push
  image: plugins/ecr

  settings:
    repo: frontend-app
    registry:
      from_secret: AWS_ECR_REGISTRY
    region:
      from_secret: AWS_REGION
    access_key:
      from_secret: AWS_ACCESS_KEY_ID
    secret_key:
      from_secret: AWS_SECRET_ACCESS_KEY
    tags:
      - latest