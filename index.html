<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple TV+ Clone</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --sub-text: #86868b;
            --accent-color: #ffffff;
            --card-bg: #1c1c1e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            padding-bottom: 50px;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), rgba(0,0,0,0));
            position: absolute;
            width: 100%;
            z-index: 10;
        }

        .logo {
            font-weight: 700;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        .nav-links a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.9rem;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            opacity: 1;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn-signin {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
        }

        /* Hero Banner */
        .hero {
            position: relative;
            height: 80vh;
            display: flex;
            align-items: flex-end;
            padding: 0 5% 80px 5%;
            background: linear-gradient(to top, #000 10%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.4)), 
                        url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=1925&auto=format&fit=crop') no-repeat center center/cover;
        }

        .hero-content {
            max-width: 600px;
        }

        .hero-tagline {
            text-transform: uppercase;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--sub-text);
            margin-bottom: 10px;
        }

        .hero-title {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 15px;
        }

        .hero-description {
            font-size: 1.1rem;
            color: #e8e8ed;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .btn-cta {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 14px 28px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-cta:hover {
            transform: scale(1.03);
        }

        /* Shelf / Row Sections */
        .shelf {
            padding: 40px 5% 0 5%;
        }

        .shelf-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .card-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 16/9;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .movie-card:hover {
            transform: scale(1.04);
        }

        .movie-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .movie-info {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0));
        }

        .movie-badge {
            background-color: rgba(255, 255, 255, 0.2);
            padding: 2px 6px;
            font-size: 0.65rem;
            font-weight: 700;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 5px;
            backdrop-filter: blur(5px);
        }

        .movie-name {
            font-size: 1rem;
            font-weight: 600;
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .nav-links { display: none; }
            .hero-title { font-size: 2.5rem; }
            .hero { height: 65vh; }
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav>
        <div class="logo">
             tv+
        </div>
        <ul class="nav-links">
            <li><a href="#" class="active">Store</a></li>
            <li><a href="#">Library</a></li>
            <li><a href="#">Search</a></li>
        </ul>
        <div class="nav-actions">
            <button class="btn-signin">Sign In</button>
        </div>
    </nav>

    <!-- Hero / Featured Section -->
    <section class="hero">
        <div class="hero-content">
            <div class="hero-tagline">Apple Original Series</div>
            <h1 class="hero-title">The Big Screen</h1>
            <p class="hero-description">An inside look at the stories, visionaries, and boundary-pushing creators shaping the future of global cinema.</p>
            <button class="btn-cta">Stream Now</button>
        </div>
    </section>

    <!-- Content Shelf 1 -->
    <section class="shelf">
        <h2 class="shelf-title">New Releases</h2>
        <div class="card-container">
            
            <div class="movie-card">
                <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=600&auto=format&fit=crop" alt="Movie Poster">
                <div class="movie-info">
                    <span class="movie-badge">PREMIERE</span>
                    <div class="movie-name">Chasing Horizon</div>
                </div>
            </div>

            <div class="movie-card">
                <img src="https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=600&auto=format&fit=crop" alt="Movie Poster">
                <div class="movie-info">
                    <span class="movie-badge">SERIES</span>
                    <div class="movie-name">Neon Genesis</div>
                </div>
            </div>

            <div class="movie-card">
                <img src="https://images.unsplash.com/photo-1535016120720-40c646be5580?q=80&w=600&auto=format&fit=crop" alt="Movie Poster">
                <div class="movie-info">
                    <span class="movie-badge">MOVIE</span>
                    <div class="movie-name">The Last Echo</div>
                </div>
            </div>

            <div class="movie-card">
                <img src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=600&auto=format&fit=crop" alt="Movie Poster">
                <div class="movie-info">
                    <span class="movie-badge">SCI-FI</span>
                    <div class="movie-name">Deep Orbit</div>
                </div>
            </div>

        </div>
    </section>

</body>
</html>
