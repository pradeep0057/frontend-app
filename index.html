<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Frontend - 4K AI Robotics Interface</title>
    <style>
        :root {
            --bg-color: #0a0c10;
            --panel-bg: #11141d;
            --accent-blue: #00f0ff;
            --accent-purple: #bd00ff;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --border-color: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 24px;
            overflow-x: hidden;
        }

        /* Core Layout Grid */
        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        @media (min-width: 1024px) {
            .dashboard-container {
                grid-template-columns: 300px 1fr;
            }
        }

        /* Header Style */
        header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 16px;
        }

        .logo-area h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(45deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-pill {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        /* Sidebar Controls */
        .sidebar {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            height: fit-content;
        }

        .sidebar h3 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .control-input {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: white;
            padding: 10px;
            border-radius: 6px;
            outline: none;
            transition: border 0.2s;
        }

        .control-input:focus {
            border-color: var(--accent-blue);
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        /* Main Content Visualizer */
        .main-content {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        @media (min-width: 768px) {
            .main-content {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Video / Display Card Placeholders */
        .display-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            transition: transform 0.3s ease;
        }

        .display-card:hover {
            transform: translateY(-4px);
            border-color: rgba(0, 240, 255, 0.4);
        }

        /* Simulating a crisp 4K visual canvas aspect ratio */
        .visual-canvas {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #020205;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-bottom: 1px solid var(--border-color);
        }

        /* Abstract vector graphic representation of AI Robot nodes */
        .wireframe-robot {
            width: 80px;
            height: 80px;
            border: 2px dashed var(--accent-blue);
            border-radius: 50%;
            animation: spin 12s linear infinite;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wireframe-robot::after {
            content: '';
            width: 40px;
            height: 40px;
            border: 2px dotted var(--accent-purple);
            border-radius: 50%;
            animation: spin-reverse 6s linear infinite;
        }

        .resolution-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,0,0,0.75);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-family: monospace;
            color: #00ff66;
            border: 1px solid rgba(0,255,102,0.3);
        }

        .card-details {
            padding: 16px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .card-meta {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Animations */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes spin-reverse {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        
        <!-- Header -->
        <header>
            <div class="logo-area">
                <h1>CLAUDE // NEURAL BOT ENGINE</h1>
            </div>
            <div class="status-pill">4K STREAMING ACTIVE</div>
        </header>

        <!-- Sidebar Inputs/Controls -->
        <aside class="sidebar">
            <h3>System Parameters</h3>
            
            <div class="control-group">
                <label for="model-select">AI Architecture</label>
                <select id="model-select" class="control-input">
                    <option value="claude-3-7">Claude Sonnet v3.7</option>
                    <option value="neural-vision">Claude Vision v4 Alpha</option>
                </select>
            </div>

            <div class="control-group">
                <label for="prompt-input">Robot Objective Prompt</label>
                <textarea id="prompt-input" class="control-input" rows="4" style="resize: none;">Execute precision kinematic routing inside warehouse matrix environment.</textarea>
            </div>

            <button class="btn-primary" onclick="alert('Compiling instructions to AI Agents...')">Initialize Core</button>
        </aside>

        <!-- Main Workspace Render Grid -->
        <main class="main-content">
            
            <!-- Robot Node 1 -->
            <div class="display-card">
                <div class="visual-canvas">
                    <span class="resolution-badge">4K // UHD</span>
                    <div class="wireframe-robot"></div>
                </div>
                <div class="card-details">
                    <div class="card-title">Cybernetic Unit Alpha-1</div>
                    <div class="card-meta">Claude Vision Overlord System • Latency: 4ms</div>
                </div>
            </div>

            <!-- Robot Node 2 -->
            <div class="display-card">
                <div class="visual-canvas">
                    <span class="resolution-badge">4K // UHD</span>
                    <div class="wireframe-robot" style="border-color: var(--accent-purple)"></div>
                </div>
                <div class="card-details">
                    <div class="card-title">Bipedal Logistics Mech</div>
                    <div class="card-meta">Real-time Pathmapping Pipeline • Latency: 7ms</div>
                </div>
            </div>

        </main>
    </div>

</body>
</html>
